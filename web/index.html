<!doctype html>
<meta charset="utf-8">
<title>SceneBid · Video intelligence demo</title>
<link rel="stylesheet" href="/styles.css">
<main>
  <header><div><p class="eyebrow">SCENEBID / VIDEO INTELLIGENCE</p><h1>Contextual playback <span>·</span> <small>Demo mode</small></h1></div><div class="live"><i></i> LIVE ANNOTATION</div></header>
  <div class="workspace">
    <section class="player-panel">
      <div id="timeline"><video id="player" controls preload="metadata"></video><div id="markers" aria-label="Ad opportunity markers"></div><section id="overlay" hidden></section></div>
      <p id="status">Loading local video…</p>
    </section>
    <aside id="context" aria-live="polite">
      <div class="panel-heading"><div><p class="eyebrow">LIVE CONTEXT</p><h2>Scene intelligence</h2></div><span id="context-time">00:00</span></div>
      <div class="context-card"><p class="label">DIALOGUE</p><p id="dialogue">Waiting for playback…</p></div>
      <div class="context-card"><p class="label">SCENE SUMMARY</p><p id="summary">Scene analysis will appear here.</p></div>
      <div class="context-card ad-playing" id="ad-playing" hidden><p class="label">AD PLAYING</p><p id="ad-details">—</p></div>
      <div class="signal"><span></span><p>Context stream synchronized<br><small>Transcript + visual analysis</small></p></div>
    </aside>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="/app.js"></script>
